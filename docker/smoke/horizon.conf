server {
    listen 8080;
    default_type application/json;

    location = /horizon/api/stats { alias /fixtures/stats.json; }
    location = /horizon/api/masters { alias /fixtures/masters.json; }
    location = /horizon/api/workload { alias /fixtures/workload.json; }
    location = /horizon/api/jobs/failed { alias /fixtures/failed.json; }
    location = /horizon/api/jobs/pending { alias /fixtures/pending.json; }
    location ~ ^/horizon/api/metrics/queues/ { alias /fixtures/queue-metrics.json; }
    location / { return 404; }
}
