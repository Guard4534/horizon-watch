[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
; The entrypoint exports APP_KEY and the container's configuration; FPM must pass them on.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
